name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI runs on the synthetic fixtures only; your real workout data never leaves your machine.
    env:
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: workout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Loader tests (pytest)
        run: pytest -v

      - name: Load fixtures into Postgres
        run: python loader/load_raw.py --data-dir tests/fixtures

      - name: dbt build (models + data tests)
        run: dbt build --project-dir dbt --profiles-dir dbt
